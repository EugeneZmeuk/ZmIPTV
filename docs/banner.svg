    <circle cx="33.5" cy="-7.5" r="1.4" fill="#FFFFFF"/>
    <circle cx="52" cy="3" r="2" fill="#0E5E36"/>
  </g>
</g>
  <text x="282" y="196" font-family="Inter, DejaVu Sans, sans-serif" font-weight="800" font-size="74" text-anchor="start" letter-spacing="1">
    <tspan fill="#3DDC84">Zm</tspan><tspan fill="#FFFFFF">IPTV</tspan>
  </text>
  <text x="286" y="238" font-family="Inter, DejaVu Sans, sans-serif" font-size="17.5" fill="#8FA3BF" text-anchor="start" letter-spacing="2.2">LIVE TV · CATCH-UP · EPG</text>
