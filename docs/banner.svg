    <use href="#back" stroke="#1C9A5C" stroke-width="34"/>
  </g>

  <!-- remote -->
  <rect x="196" y="118" width="120" height="316" rx="44" fill="url(#remote)" stroke="#55607A" stroke-width="4"/>
  <circle cx="256" cy="158" r="11" fill="#FF5A5A"/>
  <circle cx="256" cy="232" r="36" fill="#1A1E26" stroke="#2E7DFF" stroke-width="7"/>
  <circle cx="256" cy="232" r="13" fill="#3E4656"/>
  <g fill="#4A5366">
    <rect x="222" y="292" width="24" height="12" rx="6"/>
    <rect x="266" y="292" width="24" height="12" rx="6"/>
    <rect x="222" y="346" width="24" height="12" rx="6"/>
    <rect x="266" y="346" width="24" height="12" rx="6"/>
    <rect x="222" y="392" width="24" height="12" rx="6"/>
    <rect x="266" y="392" width="24" height="12" rx="6"/>
  </g>

  <!-- tapered tail -->
  <path d="M200 467 C178 460 160 450 146 436" fill="none" stroke="#0E5E36" stroke-width="30" stroke-linecap="round"/>
  <path d="M200 467 C178 460 160 450 146 436" fill="none" stroke="#2BBF72" stroke-width="22" stroke-linecap="round"/>
  <path d="M150 440 C140 431 133 422 129 410" fill="none" stroke="#0E5E36" stroke-width="16" stroke-linecap="round"/>
  <path d="M150 440 C140 431 133 422 129 410" fill="none" stroke="#2BBF72" stroke-width="9" stroke-linecap="round"/>

  <!-- snake: segments IN FRONT of the remote -->
  <g id="front" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="f1" d="M196 466 C250 486 338 452 338 405"/>
    <path id="f2" d="M174 350 C174 392 338 342 338 300"/>
    <path id="f3" d="M174 245 C174 287 338 237 338 195"/>
    <path id="neck" d="M176 150 C176 112 196 84 236 78"/>
  </g>
  <g fill="none" stroke-linecap="round">
    <use href="#front" stroke="#0E5E36" stroke-width="44"/>
    <use href="#front" stroke="url(#skin)" stroke-width="34"/>
    <use href="#front" stroke="#178A50" stroke-width="10" stroke-dasharray="9 13" opacity="0.85"/>
    <use href="#front" stroke="#B9F7D3" stroke-width="5" stroke-dasharray="0" opacity="0.25" transform="translate(-4 -6)"/>
  </g>

  <!-- head: above the remote, looking down at it (like the snake over the bowl) -->
  <g transform="translate(258 84) rotate(32) scale(1.08)">
    <path d="M62 6 L84 4 M84 4 L95 -4 M84 4 L94 13" stroke="#FF4D6D" stroke-width="4.5" stroke-linecap="round" fill="none"/>
