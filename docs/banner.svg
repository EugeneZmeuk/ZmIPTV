    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5BE39A"/>
      <stop offset="1" stop-color="#1FA864"/>
    </linearGradient>
  </defs>

  

  <!-- snake: segments BEHIND the remote -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g id="back">
      <path d="M338 405 C338 370 174 385 174 350"/>
      <path d="M338 300 C338 265 174 280 174 245"/>
      <path d="M338 195 C338 162 176 182 176 150"/>
