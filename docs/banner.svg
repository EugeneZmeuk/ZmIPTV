<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bbg" cx="30%" cy="40%" r="90%">
      <stop offset="0" stop-color="#1D3557"/><stop offset="1" stop-color="#0B1220"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bbg)"/>
  <g transform="translate(18 14) scale(0.65)">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1D3557"/>
      <stop offset="1" stop-color="#0B1220"/>
    </radialGradient>
    <linearGradient id="remote" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3A4252"/>
